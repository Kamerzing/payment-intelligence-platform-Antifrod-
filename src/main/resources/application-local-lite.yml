spring:
  config:
    import: optional:file:.env[.properties],optional:file:.env.integration[.properties],optional:file:.env.ai[.properties]
  datasource:
    url: jdbc:postgresql://127.0.0.1:${PIP_DB_PORT:5435}/payment_intelligence
    username: payment_intelligence

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  structured:
    format:
      console: ""
  pattern:
    level: "%5p [request_id=%X{request_id:-}]"
