name: payment-intelligence-platform

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: payment_intelligence
      POSTGRES_USER: payment_intelligence
      POSTGRES_PASSWORD: ${PIP_DB_PASSWORD:?Run scripts/init-local.ps1 first}
    ports:
      - "127.0.0.1:${PIP_DB_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_intelligence -d payment_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
